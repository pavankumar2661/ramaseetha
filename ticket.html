<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Ticket</title>
    <style>
        :root { --primary-bg: #3498db; --grid-border: #34495e; --mark-color: #f1c40f; }
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 15px; }
        .panel { background: white; padding: 20px; border-radius: 10px; max-width: 440px; margin: 10px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 8px solid var(--primary-bg); }
        input { padding: 12px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 5px; width: 80%; margin: 10px 0; text-align: center; }
        button { font-size: 16px; padding: 12px 24px; cursor: pointer; color: white; background: #3498db; border: none; border-radius: 6px; font-weight: bold; width: 85%; }
        #ticket-grid-view { display: none; }
        .ticket-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; background: var(--grid-border); padding: 5px; border-radius: 6px; margin-top: 15px; margin-bottom: 20px; }
        .ticket-cell { background: #fff; aspect-ratio: 1.1; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: #2c3e50; border-radius: 4px; cursor: pointer; user-select: none; }
        .ticket-cell.empty { background: #eaedf1; cursor: default; }
        .ticket-cell.marked { background: var(--mark-color); color: #000; font-size: 20px; font-weight: bold; box-shadow: inset 0 0 5px rgba(0,0,0,0.3); }
        .theme-selector { margin-bottom: 15px; display: flex; justify-content: center; gap: 10px; align-items: center; }
        .theme-dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid white; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
        .prize-box { margin-top: 20px; padding-top: 15px; border-top: 2px dashed #e2e8f0; text-align: left; }
        .prize-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #f8fafc; border-radius: 6px; margin: 6px 0; border: 1px solid #e2e8f0; }
        .claim-btn { font-size: 12px; padding: 6px 12px; width: auto; background: #e67e22; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; }
        .winner-banner { color: #27ae60; font-weight: bold; font-size: 14px; }
        #final-gameover-overlay { display: none; background: #fff5f5; border: 3px solid #e74c3c; border-radius: 8px; padding: 15px; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. Name Entry Screen -->
    <div id="join-screen" class="panel">
        <h2>Enter Your Name</h2>
        <input type="text" id="p-name" placeholder="Enter name (e.g. Pavan)">
        <br><br>
        <button onclick="generateTicketAndConnect()">Get Ticket</button>
    </div>

    <!-- 2. Main Game Dashboard -->
    <div id="ticket-grid-view" class="panel">
        <div class="theme-selector">
            <span style="font-weight: bold; font-size: 12px; color: #555;">🎨 Theme:</span>
            <div class="theme-dot" style="background: #3498db;" onclick="setTheme('#3498db', '#34495e', '#f1c40f')"></div>
            <div class="theme-dot" style="background: #9b59b6;" onclick="setTheme('#9b59b6', '#2c1a36', '#2ecc71')"></div>
            <div class="theme-dot" style="background: #e67e22;" onclick="setTheme('#e67e22', '#4a2300', '#3498db')"></div>
        </div>
        <h2 id="display-title">My Ticket</h2>
        <div id="ticket-grid" class="ticket-grid"></div>

        <div class="prize-box">
            <h3>🏆 Claim Prizes</h3>
            <div class="prize-row"><span>Early Five</span> <button class="claim-btn" id="btn-early5" onclick="sendClaim('early5')">Claim</button><span class="winner-banner" id="pwin-early5" style="display:none;"></span></div>
            <div class="prize-row"><span>First Line</span> <button class="claim-btn" id="btn-line1" onclick="sendClaim('line1')">Claim</button><span class="winner-banner" id="pwin-line1" style="display:none;"></span></div>
            <div class="prize-row"><span>Second Line</span> <button class="claim-btn" id="btn-line2" onclick="sendClaim('line2')">Claim</button><span class="winner-banner" id="pwin-line2" style="display:none;"></span></div>
            <div class="prize-row"><span>Third Line</span> <button class="claim-btn" id="btn-line3" onclick="sendClaim('line3')">Claim</button><span class="winner-banner" id="pwin-line3" style="display:none;"></span></div>
            <div class="prize-row"><span>Full House</span> <button class="claim-btn" id="btn-fullhouse" style="background:#e74c3c;" onclick="sendClaim('fullhouse')">Claim</button><span class="winner-banner" id="pwin-fullhouse" style="display:none;"></span></div>
        </div>

        <div id="final-gameover-overlay">
            <h3 style="color:#e74c3c; margin-top:0;">🏁 GAME OVER - FINAL RESULTS 🏁</h3>
            <div id="final-results-list" style="text-align:left; font-size:14px; line-height:1.6; color:#2c3e50;"></div>
        </div>
    </div>

    <script>
        var playerName = "";
        var generatedFlatString = ""; 

        function generateHashSeed(str) {
            var hash = 0;
            for (var i = 0; i < str.length; i++) { hash = str.charCodeAt(i) + ((hash << 5) - hash); }
            return Math.abs(hash);
        }

        function generateTicketAndConnect() {
            playerName = document.getElementById("p-name").value.trim();
            if (!playerName) { alert("Please enter your name!"); return; }

            document.getElementById("join-screen").style.display = "none";
            document.getElementById("ticket-grid-view").style.display = "block";
            document.getElementById("display-title").innerText = "👤 Ticket: " + playerName;

            buildTicketGridStringMethod();
            initLocalStorageSync();
        }

        function initLocalStorageSync() {
            syncClaimsUI(localStorage.getItem("tb_ledger_state"));
            window.addEventListener('storage', function(e) {
                if (e.key === "tb_ledger_state") {
                    if (e.newValue === "RESET") { window.location.reload(); } else { syncClaimsUI(e.newValue); }
                }
            });
        }

        function syncClaimsUI(ledgerData) {
            if (!ledgerData) return;
            var claims = ledgerData.split("|");
            if (claims.length < 5) return;

            var keys = ["early5", "line1", "line2", "line3", "fullhouse"];
            var labelKeys = ["Early Five", "First Line", "Second Line", "Third Line", "Full House"];
            
            for (var i = 0; i < 5; i++) {
                if (claims[i] !== "Unclaimed") {
                    document.getElementById("btn-" + keys[i]).style.display = "none";
                    var winSpan = document.getElementById("pwin-" + keys[i]);
                    winSpan.innerText = claims[i];
                    winSpan.style.display = "inline";
                }
            }

            if (claims[4] !== "Unclaimed") {
                document.getElementById("final-gameover-overlay").style.display = "block";
                var resultBox = document.getElementById("final-results-list");
                resultBox.innerHTML = "";
                for(var j=0; j<5; j++) {
                    resultBox.innerHTML += "<b>" + labelKeys[j] + ":</b> " + claims[j] + "<br>";
                }
            }
        }

        function sendClaim(prizeKey) {
            // Updated structured string to match host side perfectly
            localStorage.setItem("tb_claim_trigger", prizeKey + "|" + playerName + "|" + generatedFlatString + "|" + Date.now());
        }

        function buildTicketGridStringMethod() {
            var seed = generateHashSeed(playerName.toLowerCase());
            var grid = document.getElementById("ticket-grid");
            grid.innerHTML = "";

            var layoutString = "101101010010110101101001110"; 
            var temporaryFlatParts = [];

            for (var idx = 0; idx < 27; idx++) {
                var c = idx % 9;
                var cellType = layoutString.charAt(idx);

                if (cellType === "1") {
                    var minVal = (c * 10) + 1;
                    var maxVal = (c === 8) ? 90 : (c * 10) + 10;
                    
                    seed = (seed * 9301 + 49297) % 233280;
                    var randomFactor = seed / 233280;
                    var calculatedNum = minVal + Math.floor(randomFactor * (maxVal - minVal + 1));
                    if (calculatedNum > maxVal) calculatedNum = maxVal;

                    temporaryFlatParts.push(calculatedNum);
                } else {
                    temporaryFlatParts.push(0);
                }
            }
            
            generatedFlatString = temporaryFlatParts.join("-");

            temporaryFlatParts.forEach(function(val) {
                var cell = document.createElement("div");
                cell.className = (val === 0) ? "ticket-cell empty" : "ticket-cell";
                if(val !== 0) {
                    cell.innerText = val;
                    cell.onclick = function() { this.classList.toggle("marked"); };
                }
                grid.appendChild(cell);
            });
        }

        function setTheme(primary, border, mark) {
            document.documentElement.style.setProperty('--primary-bg', primary);
            document.documentElement.style.setProperty('--grid-border', border);
            document.documentElement.style.setProperty('--mark-color', mark);
        }
    </script>
</body>
</html>
