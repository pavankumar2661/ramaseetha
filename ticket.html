<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tambola Ticket</title>
    <style>
        :root { --primary-bg: #3498db; --grid-border: #34495e; --mark-color: #f1c40f; }
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 15px; }
        .panel { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { padding: 12px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 5px; width: 80%; margin: 8px 0; text-align: center; }
        button { font-size: 16px; padding: 12px 24px; cursor: pointer; color: white; background: #3498db; border: none; border-radius: 6px; font-weight: bold; width: 85%; }
        #ticket-view { display: none; border-top: 8px solid var(--primary-bg); }
        .ticket-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; background: var(--grid-border); padding: 5px; border-radius: 6px; margin-top: 15px; }
        .ticket-cell { background: #fff; aspect-ratio: 1.1; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: #2c3e50; border-radius: 4px; }
        .ticket-cell.empty { background: #eaedf1; }
        .ticket-cell.marked { background: var(--mark-color); color: #000; font-weight: bold; box-shadow: inset 0 0 5px rgba(0,0,0,0.3); }
        #announcement-banner { font-size: 18px; font-weight: bold; color: #e74c3c; margin: 15px 0; background: #fdf2f2; padding: 10px; border-radius: 5px; }
        .theme-selector { margin-bottom: 15px; display: flex; justify-content: center; gap: 10px; align-items: center; }
        .theme-dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid white; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <!-- Join Screen -->
    <div id="join-screen" class="panel">
        <h2>Enter Room Details</h2>
        <input type="text" id="game-code" placeholder="4-Digit Room Code (e.g. 5842)">
        <input type="text" id="p-name" placeholder="Enter Your Name">
        <button onclick="generateLocalTicket()">Connect Ticket</button>
    </div>

    <!-- Active Ticket View -->
    <div id="ticket-view" class="panel">
        <div class="theme-selector">
            <span style="font-weight: bold; font-size: 12px; color: #555;">🎨 Card Theme:</span>
            <div class="theme-dot" style="background: #3498db;" onclick="setTheme('#3498db', '#34495e', '#f1c40f')"></div>
            <div class="theme-dot" style="background: #9b59b6;" onclick="setTheme('#9b59b6', '#2c1a36', '#2ecc71')"></div>
            <div class="theme-dot" style="background: #e67e22;" onclick="setTheme('#e67e22', '#4a2300', '#3498db')"></div>
        </div>
        <h2 id="display-title">My Ticket</h2>
        <div id="announcement-banner">Waiting for Host...</div>
        <div id="ticket-grid" class="ticket-grid"></div>
    </div>

    <script>
        var targetRoom = "";

        // Deterministic Seeded Random Number Generator to keep tickets unique per name
        function seededRandom(seed) {
            var x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function generateLocalTicket() {
            var code = document.getElementById("game-code").value.trim();
            var name = document.getElementById("p-name").value.trim();
            if(!code || !name) { alert("Please fill all fields!"); return; }

            var hostRoom = localStorage.getItem("tambola_room");
            if(code !== hostRoom) {
                alert("Room not found! Ensure the code matches the host screen.");
                return;
            }

            targetRoom = code;
            document.getElementById("join-screen").style.display = "none";
            document.getElementById("ticket-view").style.display = "block";
            document.getElementById("display-title").innerText = "👤 Player: " + name;

            // Generate a seed unique to this specific player's name string length
            var nameSeed = 0;
            for(var i=0; i<name.length; i++) { nameSeed += name.charCodeAt(i); }
            var seed = parseInt(code) + nameSeed;

            var ticket = new Array(3);
            for (var r = 0; r < 3; r++) { ticket[r] = new Array(9).fill(0); }

            var p0 = "101101010".split("").map(Number);
            var p1 = "010110101".split("").map(Number);
            var p2 = "101001110".split("").map(Number);
            var patterns = new Array(p0, p1, p2);

            for (var col = 0; col < 9; col++) {
                var min = col * 10 + 1; var max = (col === 8) ? 90 : (col * 10 + 10);
                var pool = new Array();
                for (var n = min; n <= max; n++) { pool.push(n); }
                
                // Shuffle column layout based strictly on seed algorithms
                pool.sort(function() { return seededRandom(seed++) - 0.5; });

                var assigned = 0;
                for (var row = 0; row < 3; row++) {
                    if (patterns[row][col] === 1) {
                        ticket[row][col] = pool[assigned];
                        assigned++;
                    }
                }
            }

            // Clean sorting vertical matrix layouts sequentially
            for (var col = 0; col < 9; col++) {
                var vals = new Array();
                for (var row = 0; row < 3; row++) { if (ticket[row][col] !== 0) vals.push(ticket[row][col]); }
                vals.sort(function(a, b) { return a - b; });
                var vIdx = 0;
                for (var row = 0; row < 3; row++) { if (ticket[row][col] !== 0) ticket[row][col] = vals[vIdx++]; }
            }

            var grid = document.getElementById("ticket-grid");
            grid.innerHTML = "";
            for (var r = 0; r < 3; r++) {
                for (var c = 0; c < 9; c++) {
                    var val = ticket[r][c];
                    var cell = document.createElement("div");
                    cell.className = (val === 0) ? "ticket-cell empty" : "ticket-cell";
                    if(val !== 0) { cell.innerText = val; cell.id = "c-" + val; }
                    grid.appendChild(cell);
                }
            }

            startLiveSync();
        }

        function startLiveSync() {
            // Check storage loops locally every 500ms to pull new calls instantly
            setInterval(function() {
                var numbersStr = localStorage.getItem("tambola_numbers") || "";
                if(numbersStr !== "") {
                    var calledArr = numbersStr.split("-").map(Number);
                    var latest = calledArr[calledArr.length - 1];
                    document.getElementById("announcement-banner").innerText = "Last Called: " + latest;

                    calledArr.forEach(function(num) {
                        var cell = document.getElementById("c-" + num);
                        if(cell) cell.className = "ticket-cell marked";
                    });
                } else {
                    document.getElementById("announcement-banner").innerText = "Game Active! Waiting for first call...";
                }
            }, 500);
        }

        function setTheme(primary, border, mark) {
            document.documentElement.style.setProperty('--primary-bg', primary);
            document.documentElement.style.setProperty('--grid-border', border);
            document.documentElement.style.setProperty('--mark-color', mark);
        }
    </script>
</body>
</html>
