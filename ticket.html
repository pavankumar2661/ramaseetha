<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Ticket</title>
    <style>
        :root { --primary-bg: #3498db; --grid-border: #34495e; --mark-color: #f1c40f; }
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 15px; }
        .panel { background: white; padding: 20px; border-radius: 10px; max-width: 440px; margin: 10px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 8px solid var(--primary-bg); }
        input { padding: 12px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 5px; width: 80%; margin: 10px 0; text-align: center; }
        button { font-size: 16px; padding: 12px 24px; cursor: pointer; color: white; background: #3498db; border: none; border-radius: 6px; font-weight: bold; width: 85%; }
        #ticket-grid-view { display: none; }
        .ticket-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; background: var(--grid-border); padding: 5px; border-radius: 6px; margin-top: 15px; margin-bottom: 20px; }
        .ticket-cell { background: #fff; aspect-ratio: 1.1; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: #2c3e50; border-radius: 4px; cursor: pointer; user-select: none; }
        .ticket-cell.empty { background: #eaedf1; cursor: default; }
        .ticket-cell.marked { background: var(--mark-color); color: #000; font-size: 20px; font-weight: bold; box-shadow: inset 0 0 5px rgba(0,0,0,0.3); }
        .prize-box { margin-top: 20px; padding-top: 15px; border-top: 2px dashed #e2e8f0; text-align: left; }
        .prize-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #f8fafc; border-radius: 6px; margin: 6px 0; border: 1px solid #e2e8f0; }
        .claim-btn { font-size: 12px; padding: 6px 12px; width: auto; background: #e67e22; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; }
        .won-badge { font-size: 14px; font-weight: bold; color: #2ecc71; background: #e8f8f5; padding: 4px 10px; border-radius: 4px; border: 1px solid #2ecc71; text-transform: uppercase; }
        #token-display-banner { display: none; background: #e8f5e9; border: 2px solid #4caf50; color: #2e7d32; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 15px; }
        #token-txt { font-size: 34px; font-family: monospace; display: block; margin-top: 5px; background: white; padding: 5px; border-radius: 4px; border: 1px solid #a5d6a7; color: #2e7d32; letter-spacing: 4px; text-align: center; }
        #scoreboard-panel { display: none; background: #fff5f5; border: 3px solid #e74c3c; border-radius: 8px; padding: 15px; margin-top: 20px; text-align: left; }
        #scoreboard-panel h3 { margin-top: 0; color: #e74c3c; text-align: center; }
        .score-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #fdccd0; font-size: 14px; }
    </style>
</head>
<body>

    <!-- 1. Name Entry Screen -->
    <div id="join-screen" class="panel">
        <h2>Enter Your Name</h2>
        <input type="text" id="p-name" placeholder="Enter name (e.g. Pavan)">
        <br><br>
        <button onclick="generateTicketAndOpen()">Get Ticket</button>
    </div>

    <!-- 2. Main Game Dashboard -->
    <div id="ticket-grid-view" class="panel">
        <h2> My Ticket</h2>
        <div id="ticket-grid" class="ticket-grid"></div>

        <!-- 4-Digit Claim PIN Display Banner -->
        <div id="token-display-banner">📢 Claim PIN for Host:<br><span id="token-txt">----</span></div>

        <div class="prize-box">
            <h3>🏆 Generate Claim PIN</h3>
            <div class="prize-row"><span>Early Five</span> <div id="container-0"><button class="claim-btn" onclick="generateFourDigitPin(0)">Get PIN</button></div></div>
            <div class="prize-row"><span>First Line</span> <div id="container-1"><button class="claim-btn" onclick="generateValidationCode(1)">Get PIN</button></div></div>
            <div class="prize-row"><span>Second Line</span> <div id="container-2"><button class="claim-btn" onclick="generateValidationCode(2)">Get PIN</button></div></div>
            <div class="prize-row"><span>Third Line</span> <div id="container-3"><button class="claim-btn" onclick="generateValidationCode(3)">Get PIN</button></div></div>
            <div class="prize-row"><span>Full House</span> <div id="container-4"><button class="claim-btn" style="background:#e74c3c;" onclick="generateFourDigitPin(4)">Get PIN</button></div></div>
        </div>

        <!-- Real-Time Scoreboard Ledger Box -->
        <div id="scoreboard-panel">
            <h3>🏁 LEADERBOARD RECORD 🏁</h3>
            <div id="score-rows-container"></div>
        </div>
    </div>

    <script>
        var nameInput = "";
        var flatTicketNumbersList = [];

        function generateHashSeed(str) {
            var hash = 0;
            for (var i = 0; i < str.length; i++) { hash = str.charCodeAt(i) + ((hash << 5) - hash); }
            return Math.abs(hash);
        }

        function generateTicketAndOpen() {
            nameInput = document.getElementById("p-name").value.trim();
            if (!nameInput) return;
            document.getElementById("join-screen").style.display = "none";
            document.getElementById("ticket-grid-view").style.display = "block";
            buildTicketGridStringMethod();
            initWinnersRealtimeListener();
        }

        function initWinnersRealtimeListener() {
            processWinnersDataString(localStorage.getItem("tambola_winners_sync"));
            window.addEventListener('storage', function(e) {
                if (e.key === "tambola_winners_sync" && e.newValue) {
                    if (e.newValue === "RESET") { window.location.reload(); } else { processWinnersDataString(e.newValue); }
                }
            });
        }

        function processWinnersDataString(data) {
            if (!data) return;
            
            // Fixed String parsing setup layout bug entirely
            var splitTimestamp = data.split("?");
            var rawNamesString = splitTimestamp[0];
            var winners = rawNamesString.split("|");
            if (winners.length < 5) return;

            var prizeNames = ["Early Five", "First Line", "Second Line", "Third Line", "Full House"];
            var isFullHouseClaimed = false;

            for (var i = 0; i < 5; i++) {
                var winnerName = winners[i];
                if (winnerName !== "empty") {
                    var container = document.getElementById("container-" + i);
                    if (container) {
                        if (winnerName.toLowerCase() === nameInput.toLowerCase()) {
                            container.innerHTML = "<span class='won-badge'>🎉 WON!</span>";
                        } else {
                            container.innerHTML = "<span style='color:#7f8c8d; font-size:13px; font-weight:bold;'>" + winnerName + " won</span>";
                        }
                    }
                    if (i === 4) isFullHouseClaimed = true;
                }
            }

            if (isFullHouseClaimed) {
                var scoreboard = document.getElementById("scoreboard-panel");
                var rowsBox = document.getElementById("score-rows-container");
                rowsBox.innerHTML = "";
                for (var j = 0; j < 5; j++) {
                    var finalWinner = (winners[j] === "empty") ? "Unclaimed" : winners[j];
                    rowsBox.innerHTML += "<div class='score-item'><b>" + prizeNames[j] + ":</b> <span>" + finalWinner + "</span></div>";
                }
                scoreboard.style.display = "block";
                document.getElementById("token-display-banner").style.display = "none";
            }
        }

        function generateValidationCode(prizeId) {
            var sum = 0;
            var startIdx = (prizeId === 1) ? 0 : (prizeId === 2) ? 9 : 18;
            for (var idx = startIdx; idx < (startIdx + 9); idx++) {
                var num = flatTicketNumbersList[idx];
                var cellDOM = document.getElementById("cell-" + idx);
                if (num !== 0 && cellDOM && cellDOM.classList.contains("marked")) { sum += num; }
            }
            if(sum === 0) { alert("Mark line numbers first!"); return; }
            calculateAndShowPin(prizeId);
        }

        function generateFourDigitPin(prizeId) {
            var sum = 0;
            for (var idx = 0; idx < 27; idx++) {
                var num = flatTicketNumbersList[idx];
                var cellDOM = document.getElementById("cell-" + idx);
                if (num !== 0 && cellDOM && cellDOM.classList.contains("marked")) { sum += num; }
            }
            if(sum === 0) { alert("Mark numbers first!"); return; }
            calculateAndShowPin(prizeId);
        }

        function calculateAndShowPin(prizeId) {
            var cleanNameKey = nameInput.toLowerCase().replace(/\s+/g, '');
            var nameStringWeight = 0;
            for(var i=0; i < cleanNameKey.length; i++) { nameStringWeight += cleanNameKey.charCodeAt(i); }
            var calculatedPin = ((nameStringWeight * 3) + (prizeId * 17)) % 9000 + 1000;
            document.getElementById("token-txt").innerText = calculatedPin;
            document.getElementById("token-display-banner").style.display = "block";
        }

        function buildTicketGridStringMethod() {
            var seed = generateHashSeed(nameInput.toLowerCase());
            var grid = document.getElementById("ticket-grid");
            grid.innerHTML = "";
            var layoutString = "101101010010110101101001110"; 

            for (var idx = 0; idx < 27; idx++) {
                var c = idx % 9;
if (layoutString.charAt(idx) === "1") {var minVal = (c * 10) + 1;var maxVal = (c === 8) ? 90 : (c * 10) + 10;seed = (seed * 9301 + 49297) % 233280;var calculatedNum = minVal + Math.floor((seed / 233280) * (maxVal - minVal + 1));if (calculatedNum > maxVal) calculatedNum = maxVal;flatTicketNumbersList.push(calculatedNum);} else {flatTicketNumbersList.push(0);}}flatTicketNumbersList.forEach(function(val, index) {var cell = document.createElement("div");cell.className = (val === 0) ? "ticket-cell empty" : "ticket-cell";if(val !== 0) {cell.innerText = val; cell.id = "cell-" + index;cell.onclick = function() { this.classList.toggle("marked"); };}grid.appendChild(cell);});}
