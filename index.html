<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambola Host Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        h1, h2 { color: #2c3e50; }
        .main-layout { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 1100px; margin: 0 auto; }
        .panel { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex: 1; min-width: 320px; }
        #current-number { font-size: 80px; font-weight: bold; color: #e74c3c; margin: 10px 0; height: 100px; }
        button { font-size: 16px; padding: 12px 24px; cursor: pointer; color: white; border: none; border-radius: 6px; font-weight: bold; margin: 5px; }
        .btn-primary { background: #2ecc71; } .btn-primary:hover { background: #27ae60; }
        .btn-danger { background: #e74c3c; } .btn-danger:hover { background: #c0392b; }
        .btn-secondary { background: #34495e; } .btn-secondary:hover { background: #2c3e50; }
        #board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; max-width: 450px; margin: 20px auto; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .cell { padding: 8px 0; background: #e2e8f0; border-radius: 4px; font-weight: bold; color: #64748b; font-size: 14px; }
        .cell.called { background: #2ecc71; color: white; }
        input { padding: 12px; font-size: 18px; border: 2px solid #cbd5e1; border-radius: 5px; width: 50%; text-align: center; margin-bottom: 10px; font-weight: bold; letter-spacing: 2px; }
        .log-box { text-align: left; background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0; max-width: 450px; margin: 20px auto; min-height: 100px; }
    </style>
</head>
<body>

    <h1>🎙️ Tambola Host Control Panel</h1>

    <div class="main-layout">
        <!-- Master Board -->
        <div class="panel">
            <h2>Live Numbers Board</h2>
            <div id="current-number">-</div>
            <button class="btn-primary" onclick="drawHostNumber()">Next Number</button>
            <button class="btn-danger" onclick="resetGame()">Reset Game</button>
            <div id="board"></div>
        </div>

        <!-- Validation Panel -->
        <div class="panel">
            <h2>🔐 Verify 4-Digit Prize PIN</h2>
            <p style="color: #7f8c8d; font-size: 14px;">Enter the player's name and their 4-digit claim PIN:</p>
            <div>
                <input type="text" id="chk-name" placeholder="Player Name" style="letter-spacing:normal; margin-bottom:10px; font-size:16px; width:60%;"><br>
                <input type="text" id="claim-pin" maxlength="4" placeholder="4-Digit PIN"><br>
                <button class="btn-secondary" onclick="verifyPlayerPin()">Verify PIN Claim</button>
            </div>
            <h3>🏆 Verified Winners Log</h3>
            <div id="winner-log" class="log-box">No claims verified yet.</div>
        </div>
    </div>

    <script>
        var calledNumbersList = [];
        var synth = window.speechSynthesis;

        window.onload = function() {
            createHostGridBoard();
            localStorage.setItem("tambola_winners_sync", "empty|empty|empty|empty|empty");
        };

        function generateHashSeed(str) {
            var hash = 0;
            for (var i = 0; i < str.length; i++) { hash = str.charCodeAt(i) + ((hash << 5) - hash); }
            return Math.abs(hash);
        }

        function getTicketNumbersByName(name) {
            var seed = generateHashSeed(name.toLowerCase());
            var ticketList = [];
            var layoutPattern = "101101010010110101101001110";

            for (var idx = 0; idx < 27; idx++) {
                var c = idx % 9;
                if (layoutPattern.charAt(idx) === "1") {
                    var minVal = (c * 10) + 1;
                    var maxVal = (c === 8) ? 90 : (c * 10) + 10;
                    seed = (seed * 9301 + 49297) % 233280;
                    var calculatedNum = minVal + Math.floor((seed / 233280) * (maxVal - minVal + 1));
                    if (calculatedNum > maxVal) calculatedNum = maxVal;
                    ticketList.push(calculatedNum);
                } else {
                    ticketList.push(0);
                }
            }
            return ticketList;
        }

        function verifyPlayerPin() {
            var nameInput = document.getElementById("chk-name").value.trim();
            var pinInput = document.getElementById("claim-pin").value.trim();
            
            if(!nameInput || !pinInput) { alert("Complete fields!"); return; }
            if(pinInput.length !== 4) { alert("PIN must be 4 digits!"); return; }

            var playerTicket = getTicketNumbersByName(nameInput);
            var typeNames = ["Early Five", "First Line", "Second Line", "Third Line", "Full House"];
            
            var isClaimValid = false;
            var detectedPrizeName = "";
            var matchedPrizeId = -1;

            var cleanNameKey = nameInput.toLowerCase().replace(/\s+/g, '');
            var nameStringWeight = 0;
            for(var i=0; i < cleanNameKey.length; i++) { nameStringWeight += cleanNameKey.charCodeAt(i); }

            for (var prizeId = 0; prizeId < 5; prizeId++) {
                var expectedPinCalculated = ((nameStringWeight * 3) + (prizeId * 17)) % 9000 + 1000;
                if (expectedPinCalculated.toString() === pinInput) {
                    matchedPrizeId = prizeId;
                    break;
                }
            }

            if (matchedPrizeId !== -1) {
                if (matchedPrizeId === 0) {
                    var markedCount = playerTicket.filter(n => n !== 0 && calledNumbersList.includes(n)).length;
                    if (markedCount >= 5) isClaimValid = true;
                } else if (matchedPrizeId === 1) {
                    var r1 = playerTicket.slice(0, 9).filter(x => x !== 0);
                    isClaimValid = r1.every(n => calledNumbersList.includes(n));
                } else if (matchedPrizeId === 2) {
                    var r2 = playerTicket.slice(9, 18).filter(x => x !== 0);
                    isClaimValid = r2.every(n => calledNumbersList.includes(n));
                } else if (matchedPrizeId === 3) {
                    var r3 = playerTicket.slice(18, 27).filter(x => x !== 0);
                    isClaimValid = r3.every(n => calledNumbersList.includes(n));
                } else if (matchedPrizeId === 4) {
                    var fh = playerTicket.filter(n => n !== 0);
                    isClaimValid = fh.every(n => calledNumbersList.includes(n));
                }
                detectedPrizeName = typeNames[matchedPrizeId];
            }

            if (isClaimValid) {
                var log = document.getElementById("winner-log");
                if(log.innerText.includes("No claims")) log.innerHTML = "";
                log.innerHTML += "<div style='color:#2ecc71; margin:5px 0; font-weight:bold;'>✓ PIN VERIFIED: " + nameInput + " won [ " + detectedPrizeName + " ]!</div>";
                
                syncWinnerToLocalStorage(matchedPrizeId, nameInput);

                if(synth) { synth.cancel(); synth.speak(new SpeechSynthesisUtterance("Pin verified for " + nameInput)); }
                document.getElementById("claim-pin").value = "";
                document.getElementById("chk-name").value = "";
            } else {
                alert("❌ INVALID PIN: Verification failed.");
            }
        }

        function syncWinnerToLocalStorage(prizeId, winnerName) {
            var currentState = localStorage.getItem("tambola_winners_sync") || "empty|empty|empty|empty|empty";
            var cleanString = currentState.split("?")[0];
            var parts = cleanString.split("|");
            if (parts[prizeId] === "empty") { parts[prizeId] = winnerName; }
            localStorage.setItem("tambola_winners_sync", parts.join("|") + "?" + Date.now());
        }

        function drawHostNumber() {
            if (calledNumbersList.length >= 90) { alert("All numbers called!"); return; }
            var rand = 0;
            do { rand = Math.floor(Math.random() * 90) + 1; } while (calledNumbersList.includes(rand));
            calledNumbersList.push(rand);
            document.getElementById("current-number").innerText = rand;
            document.getElementById("cell-" + rand).classList.add("called");
            if (synth) { synth.cancel(); synth.speak(new SpeechSynthesisUtterance("Number " + rand)); }
        }

        function createHostGridBoard() {
            var board = document.getElementById("board");
            board.innerHTML = "";
            for (var i = 1; i <= 90; i++) {
                var cell = document.createElement("div");
                cell.className = "cell"; cell.id = "cell-" + i; cell.innerText = i;
                board.appendChild(cell);
            }
        }

        function resetGame() { 
            if (confirm("Reset board?")) {
                localStorage.setItem("tambola_winners_sync", "RESET");
                window.location.reload();
            }
        }
    </script>
</body>
</html>
