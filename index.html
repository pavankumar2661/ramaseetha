<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rama Seetha Game</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f7f6;">

    <!-- SCREEN 1: LOGIN SETUP -->
    <div id="screen-home" style="background: white; padding: 20px; border-radius: 10px; max-width: 350px; margin: auto; border: 1px solid #ccc;">
        <h2>✨ Rama Seetha Game ✨</h2>
        
        <p><strong>1. Select Your Name:</strong></p>
        
            <option value="Medhansh">Medhansh</option>
            <option value="Suma">Suma</option>
            <option value="Kanku">Kanku</option>
            <option value="Tulasi">Tulasi</option>
        </select>

        <p><strong>2. Enter Round Number (1 to 9):</strong></p>
        <p style="font-size: 12px; color: #666; margin: 0;">All 4 phones must type the exact same number!</p>
        <input type="number" id="round-number" placeholder="Example: 1" style="font-size: 18px; padding: 10px; width: 80%; margin-bottom: 20px;">

        <button onclick="checkSelection()" style="font-size: 18px; padding: 12px; width: 90%; background: green; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Confirm My Phone 🚀</button>
    </div>

    <!-- SCREEN 2: CHIT REVEAL -->
    <div id="screen-reveal" style="background: white; padding: 20px; border-radius: 10px; max-width: 350px; margin: auto; border: 1px solid #ccc; display: none;">
        <h2>🤫 Your Secret Chit</h2>
        <h3 id="reveal-username-header"></h3>
        <div id="my-role" style="font-size: 32px; font-weight: bold; color: blue; background: #e3f2fd; padding: 15px; margin: 20px 0; border-radius: 5px;"></div>
        <p style="color: #666;">Keep this card hidden from your friends!</p>
        <button onclick="window.location.reload()" style="padding: 10px; background: #666; color: white; border: none;">Exit Game</button>
    </div>

    <!-- SCREEN 3: RAMA GUESSING VIEW -->
    <div id="screen-rama" style="background: white; padding: 20px; border-radius: 10px; max-width: 350px; margin: auto; border: 1px solid #ccc; display: none;">
        <h2>🏹 You are RAMA!</h2>
        <p>Look at your 3 friends. Guess who has the <strong>Sita</strong> chit:</p>
        
        <select id="guess-select" style="font-size: 18px; padding: 10px; width: 90%; margin-bottom: 20px;">
            <!-- Populated automatically -->
        </select>
        
        <button onclick="revealWinner()" style="font-size: 18px; padding: 12px; width: 90%; background: red; color: white; border: none; border-radius: 5px; font-weight: bold;">Submit Final Guess</button>
    </div>

    <!-- SCREEN 4: SUMMARY RESULTS -->
    <div id="screen-results" style="background: white; padding: 20px; border-radius: 10px; max-width: 350px; margin: auto; border: 1px solid #ccc; display: none;">
        <h2>🏁 Round Results</h2>
        <h3 id="result-text"></h3>
        
        <div style="text-align: left; background: #eee; padding: 15px; border-radius: 5px;">
            <strong>Actual Chit Locations:</strong><br><br>
            <span id="final-reveals-list"></span>
        </div>
        
        <button onclick="window.location.reload()" style="font-size: 18px; padding: 12px; width: 90%; background: green; color: white; border: none; margin-top: 20px;">Play Next Round 🔄</button>
    </div>

    <script>
        const allPlayers = ["Medhansh", "Suma", "Kanku", "Tulasi"];

        const permutations = [
            ["Rama", "Sita", "Hanuman", "Ravana"],
            ["Sita", "Rama", "Ravana", "Hanuman"],
            ["Hanuman", "Ravana", "Rama", "Sita"],
            ["Ravana", "Hanuman", "Sita", "Rama"],
            ["Rama", "Hanuman", "Ravana", "Sita"],
            ["Sita", "Ravana", "Hanuman", "Rama"],
            ["Hanuman", "Sita", "Rama", "Ravana"],
            ["Ravana", "Rama", "Sita", "Hanuman"],
            ["Rama", "Ravana", "Sita", "Hanuman"]
        ];

        let myName = "";
        let roundAssignments = {};

        function checkSelection() {
            myName = document.getElementById("user-identity").value;
            let roundInput = document.getElementById("round-number").value.trim();

            if (!roundInput || isNaN(roundInput) || roundInput < 1) {
                alert("Please type a Round Number first!");
                return;
            }

            let index = (parseInt(roundInput) - 1) % permutations.length;
            let selectedPattern = permutations[index];

            allPlayers.forEach((player, i) => {
                roundAssignments[player] = selectedPattern[i];
            });

            let myRole = roundAssignments[myName];

            document.getElementById("screen-home").style.display = "none";

            if (myRole === "Rama") {
                document.getElementById("screen-rama").style.style.display = "block";
                document.getElementById("screen-rama").setAttribute("style", "background: white; padding: 20px; border-radius: 10px; max-width: 350px; margin: auto; border: 1px solid #ccc; display: block;");
                
                let select = document.getElementById("guess-select");
                select.innerHTML = "";
                allPlayers.forEach(player => {
                    if (player !== myName) {
                        let opt = document.createElement("option");
                        opt.value = player;
                        opt.textContent = player;
                        select.appendChild(opt);
                    }
                });
            } else {
                document.getElementById("screen-reveal").style.display = "block";
                document.getElementById("reveal-username-header").innerHTML = "Player: " + myName;
                document.getElementById("my-role").textContent = myRole;
            }
        }

        function revealWinner() {
            let guess = document.getElementById("guess-select").value;
            let actualSitaUser = "";
            
            for (let player in roundAssignments) {
                if (roundAssignments[player] === "Sita") {
                    actualSitaUser = player;
                }
            }

            document.getElementById("screen-rama").style.display = "none";
            document.getElementById("screen-results").style.display = "block";

            let resBox = document.getElementById("result-text");
            if (guess === actualSitaUser) {
                resBox.innerHTML = "🎉 Correct! You found Sita!<br>" + actualSitaUser + " had Sita. Rama gets 1000 points!";
                resBox.style.color = "green";
            } else {
                resBox.innerHTML = "😢 Wrong Guess!<br>You picked " + guess + ", but Sita was hidden on " + actualSitaUser + "!";
                resBox.style.color = "red";
            }

            let list = document.getElementById("final-reveals-list");
            list.innerHTML = "";
            allPlayers.forEach(p => {
                list.innerHTML += "• " + p + ": <strong>" + roundAssignments[p] + "</strong><br>";
            });
        }
    </script>
</body>
</html>
