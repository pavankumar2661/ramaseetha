<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambola Bingo Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        h1, h2 { color: #2c3e50; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .panel { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex: 1; min-width: 300px; }
        input { padding: 10px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 5px; width: 60%; margin-right: 10px; }
        #game-screen { display: none; margin-top: 20px; }
        #current-number { font-size: 80px; font-weight: bold; color: #e74c3c; margin: 10px 0; height: 100px; }
        button { font-size: 16px; padding: 12px 24px; cursor: pointer; color: white; border: none; border-radius: 6px; font-weight: bold; margin: 5px; }
        .btn-primary { background: #2ecc71; } .btn-primary:hover { background: #27ae60; }
        .btn-danger { background: #e74c3c; } .btn-danger:hover { background: #c0392b; }
        .btn-secondary { background: #34495e; } .btn-secondary:hover { background: #2c3e50; }
        #board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; max-width: 450px; margin: 20px auto; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .cell { padding: 8px 0; background: #e2e8f0; border-radius: 4px; font-weight: bold; color: #64748b; font-size: 14px; }
        .cell.called { background: #2ecc71; color: white; }
        .tickets-section { flex: 2; min-width: 320px; display: flex; flex-direction: column; gap: 20px; }
        .ticket-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-left: 6px solid #3498db; text-align: left; }
        .ticket-card h3 { margin: 0 0 10px 0; color: #3498db; }
        .ticket-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; background: #34495e; padding: 5px; border-radius: 6px; }
        .ticket-cell { background: #fff; aspect-ratio: 1.2; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: #2c3e50; border-radius: 4px; }
        .ticket-cell.empty { background: #eaedf1; }
        .ticket-cell.marked { background: #f1c40f; color: #000; font-size: 18px; box-shadow: inset 0 0 5px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <h1>🎰 Tambola Party 🎰</h1>

    <!-- 1. SETUP SCREEN -->
    <div id="setup-screen" class="panel" style="max-width: 500px; margin: 40px auto;">
        <h2>Add Players</h2>
        <div style="margin-bottom: 15px;">
            <input type="text" id="player-name" placeholder="Enter player name...">
            <button class="btn-secondary" onclick="addPlayer()">Add Player</button>
        </div>
        <ol id="player-list" style="text-align: left; max-width: 300px; margin: 0 auto 20px auto; color: #475569; font-weight: bold;"></ol>
        <button class="btn-primary" style="width: 100%; font-size: 18px;" onclick="startGame()">Start Game</button>
    </div>

    <!-- 2. GAME SCREEN -->
    <div id="game-screen" class="container">
        <!-- Numbers Board -->
        <div class="panel">
            <h2>Numbers Board</h2>
            <div id="current-number">-</div>
            <button class="btn-primary" id="draw-btn" onclick="drawNumber()">Next Number</button>
            <button class="btn-danger" onclick="resetGame()">Reset Game</button>
            <div id="board"></div>
        </div>
        <!-- Tickets -->
        <div class="tickets-section" id="tickets-container"></div>
    </div>

    <script>
        var players = new Array();
        var calledNumbers = new Set();

        function addPlayer() {
            var input = document.getElementById("player-name");
            var name = input.value.trim();
            if (name && !players.includes(name)) {
                players.push(name);
                var li = document.createElement("li");
                li.innerText = name;
                document.getElementById("player-list").appendChild(li);
                input.value = "";
            }
            input.focus();
        }

        document.getElementById("player-name").addEventListener("keypress", function(e) {
            if (e.key === "Enter") addPlayer();
        });

        function startGame() {
            if (players.length === 0) {
                alert("Please add at least one player!");
                return;
            }
            document.getElementById("setup-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "flex";
            createMainBoard();
            generateAllTickets();
        }

        function createMainBoard() {
            var board = document.getElementById("board");
            board.innerHTML = "";
            for (var i = 1; i <= 90; i++) {
                var cell = document.createElement("div");
                cell.className = "cell";
                cell.id = "cell-" + i;
                cell.innerText = i;
                board.appendChild(cell);
            }
        }

        function generateSimpleTicket() {
            // Replaced traditional bracket initialisation with safe Array constructor calls
            var row0 = new Array(9).fill(0);
            var row1 = new Array(9).fill(0);
            var row2 = new Array(9).fill(0);
            var ticket = new Array(row0, row1, row2);
            
            for (var col = 0; col < 9; col++) {
                var min = col * 10 + 1;
                var max = (col === 8) ? 90 : (col * 10 + 10);
                
                var colPool = new Array();
                for (var n = min; n <= max; n++) {
                    colPool.push(n);
                }
                
                colPool.sort(function() { return Math.random() - 0.5; });
                
                ticket[0][col] = colPool[0];
                ticket[1][col] = colPool[1];
            }

            while (ticket[0].filter(function(x) { return x !== 0; }).length > 5) {
                var idx = Math.floor(Math.random() * 9);
                ticket[0][idx] = 0;
            }

            while (ticket[1].filter(function(x) { return x !== 0; }).length > 5) {
                var idx = Math.floor(Math.random() * 9);
                ticket[1][idx] = 0;
            }

            var r2Placed = 0;
            var colOrder = new Array(0, 1, 2, 3, 4, 5, 6, 7, 8);
            colOrder.sort(function() { return Math.random() - 0.5; });
            
            for (var i = 0; i < 9; i++) {
                if (r2Placed >= 5) break;
                var col = colOrder[i];
                var min = col * 10 + 1;
                var max = (col === 8) ? 90 : (col * 10 + 10);
                var checkNum = Math.floor(Math.random() * (max - min + 1)) + min;
                
                if (ticket[0][col] !== checkNum && ticket[1][col] !== checkNum) {
                    ticket[2][col] = checkNum;
                    r2Placed++;
                }
            }

            for (var col = 0; col < 9; col++) {
                var vals = new Array();
                for (var row = 0; row < 3; row++) {
                    if (ticket[row][col] !== 0) vals.push(ticket[row][col]);
                }
                vals.sort(function(a, b) { return a - b; });
                
                var vIdx = 0;
                for (var row = 0; row < 3; row++) {
                    if (ticket[row][col] !== 0) {
                        ticket[row][col] = vals[vIdx++];
                    }
                }
            }
            
            return ticket;
        }

        function generateAllTickets() {
            var container = document.getElementById("tickets-container");
            container.innerHTML = "<h2>Active Player Tickets</h2>";

            players.forEach(function(player, pIndex) {
                var ticket = generateSimpleTicket();
                var card = document.createElement("div");
                card.className = "ticket-card";
                card.innerHTML = "<h3>👤 " + player + "</h3>";

                var grid = document.createElement("div");
                grid.className = "ticket-grid";

                for (var r = 0; r < 3; r++) {
                    for (var c = 0; c < 9; c++) {
                        var val = ticket[r][c];
                        var cell = document.createElement("div");
                        cell.className = val === 0 ? "ticket-cell empty" : "ticket-cell";
                        if (val !== 0) {
                            cell.innerText = val;
                            cell.id = "t-" + pIndex + "-" + val;
                        }
                        grid.appendChild(cell);
                    }
                }
                card.appendChild(grid);
                container.appendChild(card);
            });
        }

        function drawNumber() {
            if (calledNumbers.size >= 90) {
                alert("All 90 numbers have been called!");
                document.getElementById("draw-btn").disabled = true;
                return;
            }

            var rand;
            do {
                rand = Math.floor(Math.random() * 90) + 1;
            } while (calledNumbers.has(rand));

            calledNumbers.add(rand);
            document.getElementById("current-number").innerText = rand;
            document.getElementById("cell-" + rand).classList.add("called");

            players.forEach(function(player, pIndex) {
                var targetCell = document.getElementById("t-" + pIndex + "-" + rand);
                if (targetCell) {
                    targetCell.classList.add("marked");
                }
            });
