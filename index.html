<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambola Number Caller</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        h1 { color: #333; }
        #current-number { font-size: 80px; font-weight: bold; color: #ff4757; margin: 20px 0; height: 100px; }
        button { font-size: 18px; padding: 10px 20px; cursor: pointer; background: #2ed573; color: white; border: none; border-radius: 5px; margin: 5px; }
        button:hover { background: #26af5f; }
        #reset { background: #ff4757; }
        #reset:hover { background: #ff2e44; }
        #board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; max-width: 600px; margin: 20px auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .cell { padding: 10px; background: #e4e7eb; border-radius: 3px; font-weight: bold; color: #777; }
        .cell.called { background: #2ed573; color: white; }
    </style>
</head>
<body>

    <h1>Tambola Bingo Caller</h1>
    <div id="current-number">-</div>
    <button onclick="drawNumber()">Draw Number</button>
    <button id="reset" onclick="resetGame()">Reset Game</button>
    
    <div id="board"></div>

    <script>
        let calledNumbers = new Set();
        const board = document.getElementById('board');
        const currentNumDisplay = document.getElementById('current-number');

        function createBoard() {
            board.innerHTML = '';
            for (let i = 1; i <= 90; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = 'cell-' + i;
                cell.innerText = i;
                board.appendChild(cell);
            }
        }

        function drawNumber() {
            if (calledNumbers.size >= 90) {
                alert('All numbers have been called!');
                return;
            }
            let rand;
            do {
                rand = Math.floor(Math.random() * 90) + 1;
            } while (calledNumbers.has(rand));

            calledNumbers.add(rand);
            currentNumDisplay.innerText = rand;
            document.getElementById('cell-' + rand).classList.add('called');
        }

        function resetGame() {
            if (confirm('Are you sure you want to reset the game?')) {
                calledNumbers.clear();
                currentNumDisplay.innerText = '-';
                createBoard();
            }
        }

        createBoard();
    </script>
</body>
</html>
