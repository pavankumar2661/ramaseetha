<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambola Host Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        h1, h2, h3 { color: #2c3e50; }
        .main-layout { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 1100px; margin: 0 auto; }
        .panel { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex: 1; min-width: 320px; }
        #current-number { font-size: 80px; font-weight: bold; color: #e74c3c; margin: 10px 0; height: 100px; }
        button { font-size: 16px; padding: 12px 24px; cursor: pointer; color: white; border: none; border-radius: 6px; font-weight: bold; margin: 5px; }
        .btn-primary { background: #2ecc71; } .btn-primary:hover { background: #27ae60; }
        .btn-danger { background: #e74c3c; } .btn-danger:hover { background: #c0392b; }
        #board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; max-width: 450px; margin: 20px auto; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .cell { padding: 8px 0; background: #e2e8f0; border-radius: 4px; font-weight: bold; color: #64748b; font-size: 14px; }
        .cell.called { background: #2ecc71; color: white; }
        .audio-controls { margin: 15px 0; padding: 10px; background: #f8fafc; border-radius: 6px; font-size: 14px; color: #555; }
        .achievement-row { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 12px; margin: 10px 0; border-radius: 6px; border-left: 5px solid #bdc3c7; font-weight: bold; }
        .achievement-row.claimed { border-left-color: #f1c40f; background: #fffdf0; }
        .winner-tag { color: #27ae60; font-size: 16px; text-transform: capitalize; }
    </style>
</head>
<body>

    <h1>🎙️ Tambola Host Control Panel</h1>

    <div class="main-layout">
        <div class="panel">
            <h2>Live Calling Board</h2>
            <div class="audio-controls">
                <label><input type="checkbox" id="mute-voice" checked> 🔊 Enable Voice Announcements</label>
            </div>
            <div id="current-number">-</div>
            <button class="btn-primary" onclick="drawHostNumber()">Next Number</button>
            <button class="btn-danger" onclick="resetGame()">Reset Game</button>
            <div id="board"></div>
        </div>

        <div class="panel">
            <h2>🏆 Claims Ledger</h2>
            <div id="claims-box">
                <div class="achievement-row" id="ledger-early5"><span>Early Five:</span> <span class="winner-tag" id="win-early5">Unclaimed</span></div>
                <div class="achievement-row" id="ledger-line1"><span>First Line:</span> <span class="winner-tag" id="win-line1">Unclaimed</span></div>
                <div class="achievement-row" id="ledger-line2"><span>Second Line:</span> <span class="winner-tag" id="win-line2">Unclaimed</span></div>
                <div class="achievement-row" id="ledger-line3"><span>Third Line:</span> <span class="winner-tag" id="win-line3">Unclaimed</span></div>
                <div class="achievement-row" id="ledger-fullhouse"><span>Full House:</span> <span class="winner-tag" id="win-fullhouse">Unclaimed</span></div>
            </div>
        </div>
    </div>

    <script>
        var calledNumbersString = "0";
        var synth = window.speechSynthesis;

        window.onload = function() {
            createHostGridBoard();
            localStorage.setItem("tb_ledger_state", "Unclaimed|Unclaimed|Unclaimed|Unclaimed|Unclaimed");
            localStorage.removeItem("tb_claim_trigger");

            window.addEventListener('storage', function(e) {
                if (e.key === 'tb_claim_trigger' && e.newValue) {
                    var parts = e.newValue.split("|");
                    var prizeKey = parts[0];
                    var winnerName = parts[1];

                    var targetSpan = document.getElementById("win-" + prizeKey);
                    if (targetSpan && targetSpan.innerText === "Unclaimed") {
                        targetSpan.innerText = "🏆 " + winnerName;
                        document.getElementById("ledger-" + prizeKey).classList.add("claimed");
                        speakAnnouncement(winnerName + " claimed " + document.getElementById("ledger-" + prizeKey).firstElementChild.innerText);
                        updateGlobalLedgerStorage();
                    }
                }
            });
        };

        function updateGlobalLedgerStorage() {
            var ledgerString = 
                document.getElementById("win-early5").innerText + "|" +
                document.getElementById("win-line1").innerText + "|" +
                document.getElementById("win-line2").innerText + "|" +
                document.getElementById("win-line3").innerText + "|" +
                document.getElementById("win-fullhouse").innerText;
            localStorage.setItem("tb_ledger_state", ledgerString);
        }

        function createHostGridBoard() {
            var board = document.getElementById("board");
            board.innerHTML = "";
            for (var i = 1; i <= 90; i++) {
                var cell = document.createElement("div");
                cell.className = "cell";
                cell.id = "cell-" + i;
                cell.innerText = i;
                board.appendChild(cell);
            }
        }

        function speakAnnouncement(text) {
            if (!synth || document.getElementById('mute-voice').checked === false) return;
            synth.cancel();
            var utterance = new SpeechSynthesisUtterance(text);
            synth.speak(utterance);
        }

        function drawHostNumber() {
            var splitList = calledNumbersString.split("-");
            if (splitList.length >= 91) { alert("All numbers called!"); return; }
            
            var rand = 0;
            var isDuplicate = true;
            while (isDuplicate) {
                rand = Math.floor(Math.random() * 90) + 1;
                if (!splitList.includes(rand.toString())) { isDuplicate = false; }
            }

            calledNumbersString += "-" + rand;
            document.getElementById("current-number").innerText = rand;
            document.getElementById("cell-" + rand).classList.add("called");
            speakAnnouncement("Number " + rand);
        }

        function resetGame() {
            if (confirm("Reset game?")) {
                localStorage.setItem("tb_ledger_state", "RESET");
                setTimeout(function() { window.location.reload(); }, 200);
            }
        }
    </script>
</body>
</html>
