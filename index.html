<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambola Caller & Ticket Generator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f4f6f9; margin: 0; padding: 20px; }
        h1, h2 { color: #2c3e50; margin-bottom: 10px; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .panel { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); flex: 1; min-width: 300px; }
        
        /* Setup Style */
        input { padding: 10px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 5px; width: 60%; margin-right: 10px; }
        
        /* Game Screen Layout */
        #game-screen { display: none; margin-top: 20px; }
        #current-number { font-size: 90px; font-weight: bold; color: #e74c3c; margin: 10px 0; height: 110px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
        
        /* Buttons */
        button { font-size: 16px; padding: 12px 24px; cursor: pointer; color: white; border: none; border-radius: 6px; font-weight: bold; transition: background 0.2s; margin: 5px; }
        .btn-primary { background: #2ecc71; } .btn-primary:hover { background: #27ae60; }
        .btn-danger { background: #e74c3c; } .btn-danger:hover { background: #c0392b; }
        .btn-secondary { background: #34495e; } .btn-secondary:hover { background: #2c3e50; }
        
        /* Grid Board */
        #board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; max-width: 450px; margin: 20px auto; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .cell { padding: 8px 0; background: #e2e8f0; border-radius: 4px; font-weight: bold; color: #64748b; font-size: 14px; }
        .cell.called { background: #2ecc71; color: white; transform: scale(1.05); }
        
        /* Ticket Styles */
        .tickets-section { flex: 2; min-width: 500px; display: flex; flex-direction: column; gap: 20px; }
        .ticket-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border-left: 6px solid #3498db; text-align: left; }
        .ticket-card h3 { margin-top: 0; color: #3498db; text-transform: capitalize; }
        .ticket-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; background: #34495e; padding: 5px; border-radius: 6px; }
        .ticket-cell { background: #fff; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: #2c3e50; border-radius: 4px; }
        .ticket-cell.empty { background: #eaedf1; }
        .ticket-cell.marked { background: #f1c40f; color: #000; font-size: 18px; box-shadow: inset 0 0 5px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <h1>🎰 Tambola Party 🎰</h1>

    <!-- 1. Setup Screen -->
    <div id="setup-screen" class="panel" style="max-width: 500px; margin: 40px auto;">
        <h2>Add Players</h2>
        <div style="margin-bottom: 15px;">
            <input type="text" id="player-name" placeholder="Enter player name..." onkeydown="if(event.key==='Enter') addPlayer()">
            <button class="btn-secondary" onclick="addPlayer()">Add</button>
        </div>
        <ol id="player-list" style="text-align: left; max-width: 300px; margin: 0 auto 20px auto; line-height: 2; font-weight: 500; color: #475569;"></ol>
        <button class="btn-primary" style="width: 100%; font-size: 18px;" onclick="startGame()">Start Game</button>
    </div>

    <!-- 2. Main Active Game Screen -->
    <div id="game-screen" class="container">
        
        <!-- Left Side: Caller Dashboard -->
        <div class="panel">
            <h2>Numbers Board</h2>
            <div id="current-number">-</div>
            <button class="btn-primary" id="draw-btn" onclick="drawNumber()">Next Number</button>
            <button class="btn-danger" onclick="resetGame()">Reset Game</button>
            <div id="board"></div>
        </div>

        <!-- Right Side: Real-time Player Tickets -->
        <div class="tickets-section" id="tickets-container"></div>
    </div>

    <script>
        let players = [];
        let calledNumbers = new Set();
        let playerTickets = {}; // Stores generated ticket matrix arrays

        function addPlayer() {
            const input = document.getElementById('player-name');
            const name = input.value.trim();
            if (name && !players.includes(name)) {
                players.push(name);
                const li = document.createElement('li');
                li.innerText = name;
                document.getElementById('player-list').appendChild(li);
                input.value = '';
                input.focus();
            }
        }

        function startGame() {
            if (players.length === 0) {
                alert("Please add at least one player first!");
                return;
            }
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            
            createMainBoard();
            generateAllTickets();
        }

        function createMainBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            for (let i = 1; i <= 90; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = 'cell-' + i;
                cell.innerText = i;
                board.appendChild(cell);
            }
        }

        // Standard Tambola Ticket Rule Architecture
        function generateTambolaTicket() {
            // Initialize empty 3x9 grid matrix
            let ticket = Array(3).fill().map(() => Array(9).fill(0));
            
            // Define available pool column range distributions
            let columns = [];
            for (let i = 0; i < 9; i++) {
                let min = i * 10 + 1;
                let max = (i === 8) ? 90 : (i * 10 + 10);
                let pool = [];
                for (let n = min; n <= max; n++) pool.push(n);
                columns.push(pool);
            }

            // Step 1: Secure at least 1 number per column index
            let colIndices = [0,1,2,3,4,5,6,7,8];
            let rowCounts = [0, 0, 0];
            
            for (let c = 0; c < 9; c++) {
                let r = Math.floor(Math.random() * 3);
                let numIdx = Math.floor(Math.random() * columns[c].length);
                ticket[r][c] = columns[c].splice(numIdx, 1)[0];
                rowCounts[r]++;
            }

            // Step 2: Fill remaining blanks up to standard 15 total numbers (5 per row element)
            while (rowCounts.reduce((a, b) => a + b, 0) < 15) {
                let r = Math.floor(Math.random() * 3);
                let c = Math.floor(Math.random() * 9);
                
                if (ticket[r][c] === 0 && rowCounts[r] < 5 && columns[c].length > 0) {
                    let numIdx = Math.floor(Math.random() * columns[c].length);
                    ticket[r][c] = columns[c].splice(numIdx, 1)[0];
                    rowCounts[r]++;
                }
            }

            // Step 3: Sort values within vertical columns sequentially top-to-bottom
            for (let c = 0; c < 9; c++) {
                let nums = [];
                for (let r = 0; r < 3; r++) {
                    if (ticket[r][c] !== 0) nums.push(ticket[r][c]);
                }
                nums.sort((a, b) => a - b);
                let idx = 0;
                for (let r = 0; r < 3; r++) {
                    if (ticket[r][c] !== 0) ticket[r][c] = nums[idx++];
                }
            }
            return ticket;
        }

        function generateAllTickets() {
            const container = document.getElementById('tickets-container');
            container.innerHTML = '<h2>Active Player Tickets</h2>';
            playerTickets = {};

            players.forEach(player => {
                let ticket = generateTambolaTicket();
                playerTickets[player] = ticket;

                let card = document.createElement('div');
                card.className = 'ticket-card';
                card.innerHTML = `<h3>👤 ${player}</h3>`;

                let grid = document.createElement('div');
                grid.className = 'ticket-grid';

                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 9; c++) {
                        let val = ticket[r][c];
                        let cell = document.createElement('div');
                        cell.className = val === 0 ? 'ticket-cell empty' : 'ticket-cell';
                        if (val !== 0) {
                            cell.innerText = val;
                            cell.id = `ticket-${player}-${val}`;
                        }
                        grid.appendChild(cell);
                    }
                }
                card.appendChild(grid);
                container.appendChild(card);
            });
        }

        function drawNumber() {
            if (calledNumbers.size >= 90) {
                alert('Game Over! All 90 numbers have been exhausted.');
                document.getElementById('draw-btn').disabled = true;
                return;
            }

            let rand;
            do {
                rand = Math.floor(Math.random() * 90) + 1;
            } while (calledNumbers.has(rand));

            calledNumbers.add(rand);
            
            // Display Current Called Number Dashboard UI
            document.getElementById('current-number').innerText = rand;
            
            // Mark Main Caller Grid Board
