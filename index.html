<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambola Host Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        h1, h2 { color: #2c3e50; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #current-number { font-size: 80px; font-weight: bold; color: #e74c3c; margin: 10px 0; height: 100px; }
        button { font-size: 16px; padding: 12px 24px; cursor: pointer; color: white; border: none; border-radius: 6px; font-weight: bold; margin: 5px; }
        .btn-primary { background: #2ecc71; } .btn-primary:hover { background: #27ae60; }
        .btn-danger { background: #e74c3c; } .btn-danger:hover { background: #c0392b; }
        .btn-secondary { background: #34495e; } .btn-secondary:hover { background: #2c3e50; }
        #board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; max-width: 450px; margin: 20px auto; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .cell { padding: 8px 0; background: #e2e8f0; border-radius: 4px; font-weight: bold; color: #64748b; font-size: 14px; }
        .cell.called { background: #2ecc71; color: white; }
        .audio-controls { margin: 15px 0; padding: 10px; background: #f8fafc; border-radius: 6px; font-size: 14px; color: #555; }
        
        /* Fixed, high-visibility layout styles for cards */
        .qr-roster { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 20px; }
        .qr-card { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 15px; text-align: center; width: 145px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .qr-card .qr-holder { display: block; margin-bottom: 10px; background: white; padding: 5px; border-radius: 4px; width: 120px; height: 120px; margin: 0 auto 10px auto; }
        .qr-card .qr-holder img { width: 120px; height: 120px; display: block; border: none; }
        .qr-card span { font-weight: bold; color: #2c3e50; text-transform: capitalize; font-size: 14px; display: block; margin-bottom: 5px; }
        .fallback-link { font-size: 11px; color: #3498db; text-decoration: none; word-break: break-all; font-weight: bold; }
        .fallback-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>🎙️ Tambola Host Control Panel</h1>

    <div class="container">
        <!-- Setup Screen -->
        <div id="setup-section">
            <h2>Scan Tickets to Phones</h2>
            <p style="color: #7f8c8d; font-size: 14px;">Type names to generate custom QR codes. Players scan with their phones to get their tickets!</p>
            
            <div style="margin-bottom: 20px;">
                <input type="text" id="player-name" placeholder="Enter player name..." style="padding: 10px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 5px; width: 55%; margin-right: 10px;">
                <button class="btn-secondary" onclick="generateQRForPlayerPhone()">Add Player</button>
            </div>

            <div id="qr-roster-box" class="qr-roster"></div>
            <button class="btn-primary" style="width: 100%; font-size: 18px; margin-top: 25px;" onclick="startCallingGame()">Start Calling Game</button>
        </div>

        <!-- Active Board Screen -->
        <div id="caller-section" style="display: none;">
            <h2>Live Game Active</h2>
            <div class="audio-controls">
                <label><input type="checkbox" id="mute-voice" checked> 🔊 Enable Voice Announcements</label>
            </div>
            <div id="current-number">-</div>
            <button class="btn-primary" onclick="drawHostNumber()">Next Number</button>
            <button class="btn-danger" onclick="resetHostGame()">Reset Game</button>
            <div id="board"></div>
        </div>
    </div>

    <script>
        var calledNumbers = new Array();
        var synth = window.speechSynthesis;

        function generateQRForPlayerPhone() {
            var input = document.getElementById("player-name");
            var name = input.value.trim();
            if (!name) return;

            // Generate ticket map variables safely
            var flatParts = new Array();
            for (var cellIndex = 0; cellIndex < 27; cellIndex++) {
                var r = Math.floor(cellIndex / 9); var c = cellIndex % 9;
                var isNumber = false;
                if (r === 0 && (c === 0 || c === 2 || c === 3 || c === 5 || c === 7)) isNumber = true;
                if (r === 1 && (c === 1 || c === 3 || c === 4 || c === 6 || c === 8)) isNumber = true;
                if (r === 2 && (c === 0 || c === 2 || c === 5 || c === 6 || c === 7)) isNumber = true;

                if (isNumber) {
                    var minVal = (c * 10) + 1;
                    var maxVal = (c === 8) ? 90 : (c * 10) + 10;
                    var rowOffset = (r * 3) + Math.floor(Math.random() * 3);
                    var targetNum = minVal + (rowOffset % (maxVal - minVal + 1));
                    if (targetNum > maxVal) targetNum = maxVal;
                    flatParts.push(targetNum);
                } else { flatParts.push(0); }
            }
            var ticketString = flatParts.join("-");

            var currentPath = window.location.pathname;
            var directoryPath = currentPath.substring(0, currentPath.lastIndexOf('/'));
            var targetPlayerUrl = window.location.origin + directoryPath + "/ticket.html?name=" + encodeURIComponent(name) + "&data=" + ticketString;

            // Secure global open-source API link generator
            var secureQRServerUrl = "https://qrserver.com" + encodeURIComponent(targetPlayerUrl);

            // Create display layout containers natively with pure image tags
            var card = document.createElement("div");
            card.className = "qr-card";
            
            var qrHolder = document.createElement("div");
            qrHolder.className = "qr-holder";
            
            // Render directly into a solid HTML image tag
            var qrImg = document.createElement("img");
            qrImg.src = secureQRServerUrl;
            qrImg.alt = "Scan for phone ticket";
            qrHolder.appendChild(qrImg);
            
            card.appendChild(qrHolder);
            
            var label = document.createElement("span");
            label.innerText = "👤 " + name;
            card.appendChild(label);

            var backupLink = document.createElement("a");
            backupLink.className = "fallback-link";
            backupLink.href = targetPlayerUrl;
            backupLink.target = "_blank";
            backupLink.innerText = "[ Open Link ]";
            card.appendChild(backupLink);
            
            document.getElementById("qr-roster-box").appendChild(card);

            input.value = "";
            input.focus();
        }

        function startCallingGame() {
            document.getElementById("setup-section").style.display = "none";
            document.getElementById("caller-section").style.display = "block";
            createHostGridBoard();
        }

        function createHostGridBoard() {
            var board = document.getElementById("board");
            board.innerHTML = "";
            for (var i = 1; i <= 90; i++) {
                var cell = document.createElement("div");
                cell.className = "cell";
                cell.id = "cell-" + i;
                cell.innerText = i;
                board.appendChild(cell);
            }
        }

        function speakNumber(num) {
            if (!synth || document.getElementById('mute-voice').checked === false) return;
            synth.cancel();
            var utterance = new SpeechSynthesisUtterance("Number " + num);
            synth.speak(utterance);
        }

        function drawHostNumber() {
            if (calledNumbers.length >= 90) { alert("All numbers called!"); return; }
            var rand;
            do { rand = Math.floor(Math.random() * 90) + 1; } while (calledNumbers.includes(rand));

            calledNumbers.push(rand);
            document.getElementById("current-number").innerText = rand;
            document.getElementById("cell-" + rand).classList.add("called");
            
            speakNumber(rand);
        }

        function resetHostGame() {
            if (confirm("Reset game layout completely?")) { window.location.reload(); }
        }
    </script>
</body>
</html>
