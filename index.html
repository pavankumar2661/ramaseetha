<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambola Host Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        h1, h2 { color: #2c3e50; }
        .main-layout { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 1100px; margin: 0 auto; }
        .panel { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex: 1; min-width: 320px; }
        #current-number { font-size: 80px; font-weight: bold; color: #e74c3c; margin: 10px 0; height: 100px; }
        button { font-size: 16px; padding: 12px 24px; cursor: pointer; color: white; border: none; border-radius: 6px; font-weight: bold; margin: 5px; }
        .btn-primary { background: #2ecc71; } .btn-primary:hover { background: #27ae60; }
        .btn-danger { background: #e74c3c; } .btn-danger:hover { background: #c0392b; }
        .btn-secondary { background: #34495e; } .btn-secondary:hover { background: #2c3e50; }
        #board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; max-width: 450px; margin: 20px auto; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .cell { padding: 8px 0; background: #e2e8f0; border-radius: 4px; font-weight: bold; color: #64748b; font-size: 14px; }
        .cell.called { background: #2ecc71; color: white; }
        input { padding: 10px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 5px; width: 60%; text-align: center; margin-bottom: 10px; }
        .log-box { text-align: left; background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0; max-width: 450px; margin: 20px auto; min-height: 100px; }
    </style>
</head>
<body>

    <h1>🎙️ Tambola Host Control Panel</h1>

    <div class="main-layout">
        <div class="panel">
            <h2>Live Numbers Board</h2>
            <div id="current-number">-</div>
            <button class="btn-primary" onclick="drawHostNumber()">Next Number</button>
            <button class="btn-danger" onclick="resetGame()">Reset Game</button>
            <div id="board"></div>
        </div>

        <div class="panel">
            <h2>🔐 Achievement Claim Verifier</h2>
            <p style="color: #7f8c8d; font-size: 14px;">Enter the verification string called out by the player:</p>
            <div>
                <input type="text" id="claim-token" placeholder="e.g. L2-PAVAN-0-12-0..."><br>
                <button class="btn-secondary" onclick="verifyTicketClaim()">Verify Pattern Claim</button>
            </div>
            <h3>🏆 Verified Winners Log</h3>
            <div id="winner-log" class="log-box">No claims verified yet.</div>
        </div>
    </div>

    <script>
        var calledNumbersList = [];
        var synth = window.speechSynthesis;

        function drawHostNumber() {
            if (calledNumbersList.length >= 90) { alert("All numbers called!"); return; }
            var rand = 0;
            do { rand = Math.floor(Math.random() * 90) + 1; } while (calledNumbersList.includes(rand));

            calledNumbersList.push(rand);
            document.getElementById("current-number").innerText = rand;
            document.getElementById("cell-" + rand).classList.add("called");
            
            if (synth) {
                synth.cancel();
                synth.speak(new SpeechSynthesisUtterance("Number " + rand));
            }
        }

        function verifyTicketClaim() {
            var tokenInput = document.getElementById("claim-token");
            var rawToken = tokenInput.value.trim().toUpperCase();
            if(!rawToken) return;

            var parts = rawToken.split("-");
            var claimType = parts[0];  
            var playerWinner = parts[1]; 
            
            var fullTicketGrid = [];
            for (var i = 2; i < parts.length; i++) {
                fullTicketGrid.push(parseInt(parts[i]));
            }

            var typeNames = { "E5": "Early Five", "L1": "First Line", "L2": "Second Line", "L3": "Third Line", "FH": "Full House" };
            if (!typeNames[claimType] || fullTicketGrid.length !== 27) {
                alert("❌ INVALID CODE FORMAT: Re-check characters entered.");
                return;
            }

            var isClaimValid = false;

            if (claimType === "E5") {
                var matches = fullTicketGrid.filter(function(num) { return num !== 0 && calledNumbersList.includes(num); }).length;
                if (matches >= 5) isClaimValid = true;
            }
            else if (claimType === "L1") {
                var row1 = fullTicketGrid.slice(0, 9).filter(function(x) { return x !== 0; });
                isClaimValid = row1.every(function(num) { return calledNumbersList.includes(num); });
            }
            else if (claimType === "L2") {
                var row2 = fullTicketGrid.slice(9, 18).filter(function(x) { return x !== 0; });
                isClaimValid = row2.every(function(num) { return calledNumbersList.includes(num); });
            }
            else if (claimType === "L3") {
                var row3 = fullTicketGrid.slice(18, 27).filter(function(x) { return x !== 0; });
                isClaimValid = row3.every(function(num) { return calledNumbersList.includes(num); });
            }
            else if (claimType === "FH") {
                var allActive = fullTicketGrid.filter(function(x) { return x !== 0; });
                isClaimValid = allActive.every(function(num) { return calledNumbersList.includes(num); });
            }

            if (isClaimValid) {
                var log = document.getElementById("winner-log");
                if(log.innerText.includes("No claims")) log.innerHTML = "";
                log.innerHTML += "<div style='color:#2ecc71; margin:5px 0; font-weight:bold;'>✓ VERIFIED WINNER: " + playerWinner + " won [ " + typeNames[claimType] + " ]!</div>";
                if(synth) synth.speak(new SpeechSynthesisUtterance("Claim verified for " + playerWinner));
            } else {
                alert("❌ BOGUS CLAIM REJECTED: Validation failed for " + typeNames[claimType]);
                if(synth) synth.speak(new SpeechSynthesisUtterance("Bogus claim rejected."));
            }
            tokenInput.value = "";
        }

        function createHostGridBoard() {
            var board = document.getElementById("board");
            board.innerHTML = "";
            for (var i = 1; i <= 90; i++) {
                var cell = document.createElement("div");
                cell.className = "cell";
                cell.id = "cell-" + i;
                cell.innerText = i;
                board.appendChild(cell);
            }
        }

        function resetGame() { if (confirm("Reset board?")) window.location.reload(); }
        window.onload = createHostGridBoard;
    </script>
</body>
</html>
